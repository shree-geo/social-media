# Base stack. `docker compose up` runs everything locally with production-style
# images. Development overrides: docker-compose.dev.yml. Production: docker-compose.prod.yml.

x-backend-env: &backend-env
  env_file: .env

x-backend: &backend
  build:
    context: ./backend
    target: prod
  image: socialcommerce-backend:local
  <<: *backend-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  restart: unless-stopped

name: socialcommerce

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD}
      APP_PLATFORM_DB_PASSWORD: ${APP_PLATFORM_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: prod
    image: socialcommerce-backend:local
    <<: *backend-env
    # Migrations, then idempotent reference data. On the very first run the seed prints the
    # bootstrap platform admin's temporary password once: `docker compose logs migrate`.
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "-Q", "webhooks,outbound,media,default,pdf", "--concurrency=2"]

  beat:
    <<: *backend
    # Exactly one beat instance per deployment.
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build:
      context: ./frontend
      target: prod
    image: socialcommerce-frontend:local
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Local S3 (SeaweedFS) and email capture. Disabled in docker-compose.prod.yml.
  storage:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=50 -master.volumeSizeLimitMB=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
