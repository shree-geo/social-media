# Single-host routing for development and simple single-VPS deployments.
# Production TLS is terminated here or at a cloud load balancer in front of it.

# Docker's DNS. `resolve` re-looks-up the containers when they are recreated (new IPs), so a
# backend/frontend restart never leaves nginx pointing at a dead address (502 until reload).
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_upstream  { zone backend_upstream 64k;  server backend:8000 resolve;  keepalive 16; }
upstream frontend_upstream { zone frontend_upstream 64k; server frontend:3000 resolve; keepalive 16; }

# Behind another proxy (docker-compose.server.yml): take the client address and scheme it reports.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

limit_req_zone $binary_remote_addr zone=api_ip:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook_ip:10m  rate=50r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;

    # Webhooks: small bodies, generous rate (Meta batches deliveries).
    location /api/v1/webhooks/ {
        client_max_body_size 1m;
        limit_req zone=webhook_ip burst=200 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Auth endpoints: strict per-IP limit (the app adds per-account limits).
    location /api/v1/auth/login {
        limit_req zone=auth_ip burst=10 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Server-sent events: no buffering, long-lived.
    location /api/v1/events/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://backend_upstream;
    }

    location /api/ {
        limit_req zone=api_ip burst=40 nodelay;
        proxy_pass http://backend_upstream;
    }

    location /health {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;     # Next.js dev HMR websocket
        proxy_set_header Connection $http_connection;
        proxy_pass http://frontend_upstream;
    }
}
