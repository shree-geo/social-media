# Single-host routing for development and simple single-VPS deployments.
# Production TLS is terminated here or at a cloud load balancer in front of it.

upstream backend_upstream  { server backend:8000; keepalive 16; }
upstream frontend_upstream { server frontend:3000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=api_ip:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook_ip:10m  rate=50r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Webhooks: small bodies, generous rate (Meta batches deliveries).
    location /api/v1/webhooks/ {
        client_max_body_size 1m;
        limit_req zone=webhook_ip burst=200 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Auth endpoints: strict per-IP limit (the app adds per-account limits).
    location /api/v1/auth/login {
        limit_req zone=auth_ip burst=10 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Server-sent events: no buffering, long-lived.
    location /api/v1/events/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://backend_upstream;
    }

    location /api/ {
        limit_req zone=api_ip burst=40 nodelay;
        proxy_pass http://backend_upstream;
    }

    location /health {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;     # Next.js dev HMR websocket
        proxy_set_header Connection $http_connection;
        proxy_pass http://frontend_upstream;
    }
}
