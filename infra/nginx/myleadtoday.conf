# myleadtoday.cloud behind the host's nginx (test server, see docker-compose.server.yml).
# The certificate comes from certbot's webroot method (lineage "myleadtoday.cloud"):
#   certbot certonly --webroot -w /var/www/certbot --cert-name myleadtoday.cloud \
#     -d myleadtoday.cloud -d www.myleadtoday.cloud -d dev.myleadtoday.cloud -d prod.myleadtoday.cloud \
#     --deploy-hook "systemctl reload nginx"
# Install: copy to /etc/nginx/sites-available/myleadtoday, link into sites-enabled,
# then `if nginx -t; then systemctl reload nginx; fi` (never reload when the test fails).

# HTTP: certificate checks only; everything else moves to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name myleadtoday.cloud www.myleadtoday.cloud dev.myleadtoday.cloud prod.myleadtoday.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://myleadtoday.cloud$request_uri; }
}

# Other names on the certificate → the bare domain.
server {
    # nginx 1.24 (Ubuntu 24.04) takes http2 on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myleadtoday.cloud dev.myleadtoday.cloud prod.myleadtoday.cloud;
    ssl_certificate     /etc/letsencrypt/live/myleadtoday.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myleadtoday.cloud/privkey.pem;
    return 301 https://myleadtoday.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myleadtoday.cloud;

    ssl_certificate     /etc/letsencrypt/live/myleadtoday.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myleadtoday.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:myleadtoday_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events: no buffering, long-lived.
    location /api/v1/events/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8040;
    }

    location / {
        proxy_pass http://127.0.0.1:8040;
    }
}
